<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f9fafb;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px; background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
        <h2 style="color: #4F46E5; margin-bottom: 16px;">New Course Available!</h2>
        <p style="color: #374151; font-size: 16px; line-height: 1.6;">We are excited to announce a new course on our platform:</p>
        <h3 style="color: #111827; margin-bottom: 8px;">{{CourseTitle}}</h3>
        <p style="color: #4B5563; font-size: 14px; line-height: 1.6;">{{CourseDescription}}</p>
        <p style="font-size: 16px; font-weight: bold; color: #10B981; margin-top: 16px;">Price: {{CoursePrice}}</p>
        <a href="https://localhost:7031/Course/Detail/{{CourseId}}" style="display: inline-block; background-color: #4F46E5; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 15px;">Enroll Now</a>
        <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 20px 0;" />
        <p style="font-size: 12px; color: #9CA3AF;">You received this email because you subscribed to our newsletter.</p>
    </div>
</body>
</html>
